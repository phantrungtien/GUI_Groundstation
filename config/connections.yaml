# Profile ket noi. `mode` la nguon su that quyet dinh mau banner va viec khoa
# nut dieu khien — KHONG suy ra tu chuoi ket noi (nguyen tac 2.5).
#   REAL   do    — bay that
#   SIM    xanh  — SITL
#   REPLAY xam   — phat lai .tlog hay .bin cua the SD, khoa moi nut
#
# Ba dong duoi day la ba tinh huong that, khong hon: bay that, mo phong, kham
# nghiem. Da bo may profile SITL trung nhau (udp:14551 qua mavproxy, tcp:5760
# truc tiep) — chung chi khac nhau o cong, va giu nhieu duong vao cung mot SITL
# thi chi tao co hoi chon nham.

# KHUON cho cong USB tu quet — muc REAL khong co `conn` thi khong hien trong
# danh sach, no chi cho muon baud/sysid/remote. App tu tim moi cong USB-serial
# dang cam (ttyUSB*, ttyACM*) va tao mot dong cho tung cong; cam sang cong khac
# hay cam them thiet bi USB la so thu tu doi, khong phai sua file nay.
# Bam "Quet lai cong USB" o panel khi cam/rut trong luc app dang chay.
- &sik
  name: "SiK radio"
  mode: REAL
  baud: 57600         # bo trong thi ttyACM -> 115200, ttyUSB -> 57600
  sysid: 254          # sysid rieng cho laptop, khac companion (nguyen tac 2.3)
  # Nua ROS2 qua WiFi toi companion. Bo trong thi app chi chay nua SiK — van bay
  # va van co nut do, chi mat vision/SLAM/task. Do la ranh gioi suy giam chuc nang.
  #
  # Video: tu 11/10/2026 Jetson DAY H.264 (MPEG-TS) qua UDP toi cong 5600 cua laptop
  # (~235 KB/s, nhe ~12 lan MJPEG). Bo dong `video` thi app quay ve MJPEG cong 8080
  # suy tu `remote`. So nguoi: `status` — GET moi 0,5 s, lay `total`, timeout 1 s,
  # loi/het gio thi hien "--". HTTP thuong (https vao 8080 loi SSL, do 15/10/2026).
  #
  # Companion la Jetson `trungtien-drone`, goi qua TEN Tailscale (MagicDNS) chu
  # khong qua .local hay IP: sau nay Jetson len mang bang USB LTE, khong chung LAN
  # nen mDNS khong toi; IP LAN thi DHCP doi; con IP Tailscale doi theo tai khoan
  # (10/10/2026 dang nhap lai la 100.73.168.102 -> 100.117.32.3). Tren cung LAN
  # Tailscale tu di thang (do: pong qua 192.168.1.47 trong 3 ms, video 15 fps).
  # Laptop PHAI dang `tailscale up` cung tai khoan, khong thi khong thay video.
  remote: "ws://trungtien-drone.tailff0d80.ts.net:8765"
  video: "udp://0.0.0.0:5600"
  status: "http://100.117.32.3:8080/status"   # IP Tailscale: dang nhap lai tai khoan la doi
  feedback: "100.117.32.3:5601"   # bao mat goi -> Jetson tu chinh bitrate (run_gui --h264-fb-port)

# Mo phong: DUY NHAT mot profile SITL tren laptop — SITL + Gazebo cua ~/fire_drone_ws.
# Chay truoc:  ~/fire_drone_ws/scripts/run_sim.sh   (tat: run_sim.sh stop)
# Script do mo SITL --no-mavproxy (MAVROS giu 5760), ros2_bridge (8765) va mjpeg_server
# day camera NADIR CUA SIM ra 8080. Cong 5762, khong phai 5763: do 15/10/2026 5762 co
# heartbeat con 5763 im lang. Profile sim cu (simtofly sitl_mission.launch.py, 5763,
# video Jetson) da bo 18/10/2026 — can lai thi xem git log.
- name: "SITL"
  android: false
  mode: SIM
  conn: "tcp:127.0.0.1:5762"
  sysid: 254
  remote: "ws://127.0.0.1:8765"
  video: "http://127.0.0.1:8080/stream"

# DIEN THOAI: DUY NHAT mot profile, MAVLink di HAI duong cung luc toi cung FC:
#  - radio SiK cam OTG. Python khong mo duoc USB tren Android, nen lop Java
#    android/java/org/trungtien/gcs/SikBridge.java mo radio (57600) va dua ra cong
#    TCP noi bo. `bridge: true` = bang stream hep cua radio (stream_table).
#  - mang (`conn2`): dien thoai NGHE UDP 14550, MAVROS tren Jetson day toi IP
#    Tailscale cua dien thoai — `gcs_url:=udp://@<IP Tailscale dien thoai>:14550`.
# Dung mot duong, duong kia nghe; duong dang dung im 2 s ma duong kia co FC thi tu
# doi (core/adapters/sik.py DualLink), hang link tren man hinh doi chu SiK/Mang.
# `<<: *sik` = muon nguyen phan companion (remote/video/status/feedback) cua
# "SiK radio": IP Tailscale doi thi chi sua mot cho. Video H.264 thi Jetson DAY toi
# mot IP co dinh (run_gui.py --h264) — muon co hinh tren dien thoai phai doi IP do.
- <<: *sik
  name: "Dien thoai: SiK OTG + mang"
  android: true
  conn: "tcp:127.0.0.1:5760"
  conn2: "udpin:0.0.0.0:14550"
  bridge: true

- name: "Phat lai chuyen bay (.tlog)"
  mode: REPLAY
  path: "logs/*.tlog"
