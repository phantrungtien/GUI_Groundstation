# Profile ket noi. `mode` la nguon su that quyet dinh mau banner va viec khoa
# nut dieu khien — KHONG suy ra tu chuoi ket noi (nguyen tac 2.5).
#   REAL   do    — bay that
#   SIM    xanh  — SITL
#   REPLAY xam   — phat lai .tlog hay .bin cua the SD, khoa moi nut
#
# Ba dong duoi day la ba tinh huong that, khong hon: bay that, mo phong, kham
# nghiem. Da bo may profile SITL trung nhau (udp:14551 qua mavproxy, tcp:5760
# truc tiep) — chung chi khac nhau o cong, va giu nhieu duong vao cung mot SITL
# thi chi tao co hoi chon nham.

# KHUON cho cong USB tu quet — muc REAL khong co `conn` thi khong hien trong
# danh sach, no chi cho muon baud/sysid/remote. App tu tim moi cong USB-serial
# dang cam (ttyUSB*, ttyACM*) va tao mot dong cho tung cong; cam sang cong khac
# hay cam them thiet bi USB la so thu tu doi, khong phai sua file nay.
# Bam "Quet lai cong USB" o panel khi cam/rut trong luc app dang chay.
- name: "SiK radio"
  mode: REAL
  baud: 57600         # bo trong thi ttyACM -> 115200, ttyUSB -> 57600
  sysid: 254          # sysid rieng cho laptop, khac companion (nguyen tac 2.3)
  # Nua ROS2 qua WiFi toi companion. Bo trong thi app chi chay nua SiK — van bay
  # va van co nut do, chi mat vision/SLAM/task. Do la ranh gioi suy giam chuc nang.
  #
  # Video: tu 11/10/2026 Jetson DAY H.264 (MPEG-TS) qua UDP toi cong 5600 cua laptop
  # (~235 KB/s, nhe ~12 lan MJPEG). Bo dong `video` thi app quay ve MJPEG cong 8080
  # suy tu `remote`. So nguoi: topic ROS2 /vision/person_count, ros2_bridge tren Jetson
  # day len qua `remote` (cong 8765) — bridge phai dang chay.
  #
  # Companion la Jetson `trungtien-drone`, goi qua TEN Tailscale (MagicDNS) chu
  # khong qua .local hay IP: sau nay Jetson len mang bang USB LTE, khong chung LAN
  # nen mDNS khong toi; IP LAN thi DHCP doi; con IP Tailscale doi theo tai khoan
  # (10/10/2026 dang nhap lai la 100.73.168.102 -> 100.117.32.3). Tren cung LAN
  # Tailscale tu di thang (do: pong qua 192.168.1.47 trong 3 ms, video 15 fps).
  # Laptop PHAI dang `tailscale up` cung tai khoan, khong thi khong thay video.
  remote: "ws://trungtien-drone.tailff0d80.ts.net:8765"
  video: "udp://0.0.0.0:5600"

# Mo phong. Can hai thu chay truoc:
#   1. ros2 launch simtofly_mavros_sitl sitl_mission.launch.py
#   2. source /opt/ros/humble/setup.bash && python3 tools/ros2_bridge.py
#
# Cong nao cam vao dau: MAVProxy giu TCP 5760, MAVROS giu UDP 14550. SITL con mo
# san 5762/5763 — cam vao 5763 thi khong phai sua launch file ben ROS2.
- name: "SITL + ROS2 (sitl_mission.launch.py)"
  mode: SIM
  conn: "tcp:127.0.0.1:5763"
  sysid: 254
  remote: "ws://127.0.0.1:8765"
  # Nua ROS2 o tren chay NGAY TREN laptop, con camera van nam tren Jetson va day
  # H.264 thang ve laptop — nen video phai khai rieng (bo dong nay thi app di tim
  # MJPEG o 127.0.0.1:8080, khong co).
  video: "udp://0.0.0.0:5600"

- name: "Phat lai chuyen bay (.tlog)"
  mode: REPLAY
  path: "logs/*.tlog"

# Chi xem video Jetson, khong co SiK radio cam vao. Nua SiK se do (dung vay — khong
# co radio that), nua video van chay vi no di duong WiFi rieng. Cam radio roi
# bam "Quet lai cong USB" thi dung profile "SiK radio" o tren, khong dung cai nay.
- name: "Chi video (camera Jetson)"
  mode: REAL
  conn: "udp:127.0.0.1:14550"   # cong trong — chi de profile hien ra, khong co FC
  sysid: 254
  remote: "ws://trungtien-drone.tailff0d80.ts.net:8765"
  video: "udp://0.0.0.0:5600"
